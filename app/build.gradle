plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fde.taskplugin'
    compileSdk 34

    defaultConfig {
        applicationId "com.fde.taskplugin"
        minSdkVersion 30
        targetSdkVersion 34
        versionCode 13
        versionName "1.3"
    }

    signingConfigs {
        release {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('plugin.keystore')
            storePassword 'android'
        }
        debug {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('plugin.keystore')
            storePassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        abortOnError false
    }
}

configurations {
    // Kotlin stdlib is bundled in SystemUISharedLib.jar; avoid pulling in a second copy
    // from maven that could mismatch the version used by the host process.
    implementation.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
    implementation.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-common'
    implementation.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    implementation.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    implementation.exclude group: 'org.jetbrains', module: 'annotations'

}

dependencies {
    // Host (launcher) provides the plugin API classes (com.android.systemui.plugins.*)
    // via its filtered parent ClassLoader, so they must NOT be packaged into the APK.
    compileOnly files('libs/framework.jar')
    compileOnly files('libs/launcher-plugin-api.jar')
    // Bundled into the APK: provides kotlin stdlib (and Plugin core classes) at runtime.
    implementation files('libs/SystemUISharedLib.jar')


    // 协程核心库
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.4.3"
    // 协程Android支持库
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.3"
    // 协程Java8支持库
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.4.3"
    implementation 'com.caverock:androidsvg:1.4'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'com.google.code.gson:gson:2.2.4'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    implementation 'com.caverock:androidsvg:1.4'
//	implementation project(':restrictionbypass')

    implementation 'com.squareup.okhttp3:okhttp:3.5.0'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'com.xwdz:okHttpUtils:1.3.0'

    implementation 'com.github.hackware1993:MagicIndicator:1.7.0' // for androidx
    implementation 'com.belerweb:pinyin4j:2.5.1'

    implementation("androidx.work:work-runtime-ktx:2.9.0")
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0")
    implementation("androidx.lifecycle:lifecycle-livedata-ktx:2.7.0")
}
